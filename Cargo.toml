[workspace]
resolver = "3"
members = ["crates/itr-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
rust-version = "1.98"

[workspace.dependencies]
itr-core = { path = "crates/itr-core" }
itr-hydro = { path = "crates/itr-hydro" }
itr-opt = { path = "crates/itr-opt" }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
inherits = "release"
strip = false

# Tests exercise numerics heavily; keep them fast.
[profile.test]
opt-level = 2

[profile.profiling]
inherits = "release"
strip = false
debug = 1
