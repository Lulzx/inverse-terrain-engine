name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]   # x86-64 Linux + aarch64 macOS (D1, spec §12 Phase A)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show            # installs the pinned toolchain from rust-toolchain.toml
      - run: cargo build --release --locked
      - run: cargo test --release --locked          # default members (CPU crates)
      - run: cargo clippy --release --locked --all-targets -- -D warnings
      - run: ./target/release/itr validate --json > validation-${{ matrix.os }}.json
      - run: |
          ./target/release/itr synth examples
          ./target/release/itr optimize --scenario examples/synthetic-valley/scenario.toml --out runs/sv --max-sims 24 --threads 2
          set +e; ./target/release/itr optimize --scenario examples/infeasible-problem/scenario.toml --out runs/inf --max-sims 12 --threads 2; test $? -eq 2
      - uses: actions/upload-artifact@v4
        with: { name: "trace-${{ matrix.os }}", path: "runs/sv/search.jsonl" }
  cross-arch:
    # D1: the seeded search trace must be bitwise identical on x86-64 and aarch64
    # (wall-clock fields excepted).
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - run: |
          strip() { python3 -c 'import json,sys
          for l in open(sys.argv[1]):
              d=json.loads(l); d.pop("wall_s",None); d.get("record",{}).pop("wall_s",None); print(json.dumps(d,sort_keys=True))' "$1"; }
          diff <(strip trace-ubuntu-latest/search.jsonl) <(strip trace-macos-latest/search.jsonl)
  gpu:
    # The wgpu backend builds everywhere; its tests skip when no adapter is present.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo build --release --locked -p itr-cli --features gpu
      - run: cargo test --release --locked -p itr-gpu
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
