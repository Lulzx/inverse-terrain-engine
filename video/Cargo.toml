[package]
name = "video"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
fframes = { version = "=1.2.1-rc.14", features = ["compile-time-svgtree", "cli"] }
fframes_skia_renderer = { version = "=1.2.1-rc.14", features = ["metal"] }
fframes_native_player = { version = "=1.2.1-rc.14", default-features = false, features = ["metal", "audio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(windows))'.dependencies]
fframes = { version = "=1.2.1-rc.14", features = ["h264", "libav-agree-gpl", "videotoolbox"] }

[lib]
name = "video"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "video"
path = "src/main.rs"

[workspace]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

