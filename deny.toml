# cargo-deny policy (spec §8.4, §19.6): permissive licenses only, no C-toolchain crates.
[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "Zlib", "Unicode-3.0", "CC0-1.0", "MIT-0", "BSL-1.0"]

[bans]
multiple-versions = "warn"
deny = [
  { name = "cc", reason = "default build must not need a C toolchain (spec §8.4)" },
  { name = "gdal" },
  { name = "tokio" },
  { name = "openssl-sys" },
]

[advisories]
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
